
apiVersion: v1
kind: Pod

metadata:
  name: nginx-pod
  namespace: default

  labels:
    app: nginx
    environment: dev
    project: kubernetes-practice

  annotations:
    description: "My first Kubernetes practice pod"

spec:
  restartPolicy: Always

  containers:
    - name: nginx-container
      image: nginx:latest

      ports:
        - containerPort: 80
          protocol: TCP

      env:
        - name: APP_ENV
          value: "development"

      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 10

      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5

